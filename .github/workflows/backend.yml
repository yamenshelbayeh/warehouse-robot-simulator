name: Backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", "NuGet.Config", ".config/**", "*.sln"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "NuGet.Config", ".config/**", "*.sln"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAREHOUSE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=warehouse;Password=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore WarehouseRobotSimulator.sln --configfile NuGet.Config
      - run: dotnet build WarehouseRobotSimulator.sln --no-restore --configuration Release --warnaserror
      - run: dotnet test WarehouseRobotSimulator.sln --no-build --no-restore --configuration Release
      - run: dotnet run --project backend/Simulation.Demo --no-build --no-restore --configuration Release
